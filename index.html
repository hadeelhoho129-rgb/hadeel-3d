<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
    }

    .scene {
  position: relative;
  width: 100%;
  height: 800px;

  background-image: url("./had.png");
  background-size: 100% 75% !important;
  background-position: center;
  background-repeat: no-repeat;
  overflow: hidden;
}

    model-viewer {
      position: absolute;
      width: 40%;
      height: 40%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      --poster-color: transparent;
    }
  </style>
</head>

<body>
  <div class="scene">
    <model-viewer
      src="./hadeel.glb"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      interaction-prompt="none">
    </model-viewer>
  </div>
</body>
</html>
